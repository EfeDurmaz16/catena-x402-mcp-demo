version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # The @x402/* pins are exact on purpose: they move together and every
    # bump is checked against the payment tests by hand.
    ignore:
      - dependency-name: "@x402/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
