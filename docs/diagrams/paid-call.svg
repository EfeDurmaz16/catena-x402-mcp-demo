<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">One paid tool call</title>
  <desc id="desc">Sequence of one paid MCP tools/call across Client, Proxy, Server, Facilitator, and Catena</desc>
  <defs>
    <style>
      .bg { fill: #FAFAF8; }
      .ink { fill: #1A1A1A; }
      .muted { fill: #6B6860; }
      .lane { fill: none; stroke: #C8C5BE; stroke-width: 1; stroke-dasharray: 3 4; }
      .box { fill: #FFFFFF; stroke: #C8C5BE; stroke-width: 1.25; }
      .free { fill: #F3F2EE; stroke: #C8C5BE; stroke-width: 1.25; }
      .paid { fill: #E8F5F0; stroke: #0B6E4F; stroke-width: 1.5; }
      .accent { fill: #0B6E4F; }
      .msg { stroke: #1A1A1A; fill: none; stroke-width: 1.35; marker-end: url(#arrow); }
      .msg-muted { stroke: #8A867C; fill: none; stroke-width: 1.2; marker-end: url(#arrow-muted); }
      .msg-accent { stroke: #0B6E4F; fill: none; stroke-width: 1.5; marker-end: url(#arrow-accent); }
      .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 600; }
      .sub { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 10.5px; font-weight: 400; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 650; }
      .lane-h { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 650; }
      .badge { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 10px; font-weight: 650; }
      .step { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; font-weight: 500; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5 Z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5 Z" fill="#8A867C"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5 Z" fill="#0B6E4F"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="520" rx="10"/>

  <text class="title ink" x="28" y="36">One paid tool call</text>
  <text class="sub muted" x="28" y="54">Free discovery, then pay-on-call through the proxy</text>

  <rect class="free" x="620" y="22" width="52" height="20" rx="4"/>
  <text class="badge muted" x="646" y="36" text-anchor="middle">FREE</text>
  <rect class="paid" x="684" y="22" width="52" height="20" rx="4"/>
  <text class="badge accent" x="710" y="36" text-anchor="middle">PAID</text>
  <text class="sub muted" x="748" y="36">vs</text>
  <text class="sub muted" x="768" y="36">settlement</text>

  <g transform="translate(0,72)">
    <text class="lane-h ink" x="90" y="0" text-anchor="middle">Client</text>
    <text class="lane-h ink" x="250" y="0" text-anchor="middle">Proxy</text>
    <text class="lane-h ink" x="420" y="0" text-anchor="middle">Server</text>
    <text class="lane-h ink" x="600" y="0" text-anchor="middle">Facilitator</text>
    <text class="lane-h accent" x="780" y="0" text-anchor="middle">Catena</text>

    <line class="lane" x1="90" y1="12" x2="90" y2="420"/>
    <line class="lane" x1="250" y1="12" x2="250" y2="420"/>
    <line class="lane" x1="420" y1="12" x2="420" y2="420"/>
    <line class="lane" x1="600" y1="12" x2="600" y2="420"/>
    <line class="lane" x1="780" y1="12" x2="780" y2="420" style="stroke:#0B6E4F;stroke-dasharray:3 4"/>

    <!-- tools/list FREE -->
    <rect class="free" x="108" y="28" width="124" height="28" rx="5"/>
    <text class="badge muted" x="170" y="46" text-anchor="middle">tools/list - FREE</text>
    <line class="msg-muted" x1="90" y1="42" x2="106" y2="42"/>
    <line class="msg-muted" x1="232" y1="42" x2="250" y2="42"/>
    <line class="msg-muted" x1="250" y1="56" x2="420" y2="56"/>
    <text class="step muted" x="335" y="50" text-anchor="middle">forward verbatim</text>
    <line class="msg-muted" x1="420" y1="72" x2="250" y2="72"/>
    <line class="msg-muted" x1="250" y1="86" x2="90" y2="86"/>
    <text class="step muted" x="170" y="80" text-anchor="middle">tool list</text>

    <!-- tools/call PAID -->
    <rect class="paid" x="108" y="108" width="124" height="28" rx="5"/>
    <text class="badge accent" x="170" y="126" text-anchor="middle">tools/call - PAID</text>
    <line class="msg" x1="90" y1="122" x2="106" y2="122"/>
    <line class="msg" x1="232" y1="122" x2="250" y2="122"/>
    <line class="msg" x1="250" y1="140" x2="420" y2="140"/>
    <text class="step ink" x="335" y="134" text-anchor="middle">POST (no payment)</text>
    <line class="msg" x1="420" y1="160" x2="250" y2="160"/>
    <rect class="box" x="268" y="148" width="130" height="24" rx="4"/>
    <text class="badge ink" x="333" y="164" text-anchor="middle">402 PAYMENT-REQUIRED</text>

    <!-- proxy signs -->
    <rect class="paid" x="178" y="192" width="144" height="36" rx="5"/>
    <text class="badge accent" x="250" y="207" text-anchor="middle">proxy signs</text>
    <text class="sub muted" x="250" y="221" text-anchor="middle">EIP-3009 - spend cap</text>

    <!-- facilitator -->
    <line class="msg-accent" x1="322" y1="210" x2="420" y2="210"/>
    <line class="msg-accent" x1="420" y1="230" x2="600" y2="230"/>
    <text class="step accent" x="510" y="224" text-anchor="middle">verify / settle</text>
    <line class="msg-accent" x1="600" y1="250" x2="780" y2="250"/>
    <rect class="paid" x="708" y="236" width="120" height="28" rx="5"/>
    <text class="badge accent" x="768" y="254" text-anchor="middle">USDC deposit</text>

    <!-- tool runs -->
    <line class="msg" x1="600" y1="280" x2="420" y2="280"/>
    <rect class="box" x="358" y="268" width="124" height="24" rx="4"/>
    <text class="badge ink" x="420" y="284" text-anchor="middle">tool runs</text>

    <!-- result -->
    <line class="msg" x1="420" y1="310" x2="250" y2="310"/>
    <line class="msg" x1="250" y1="330" x2="90" y2="330"/>
    <rect class="box" x="40" y="318" width="100" height="24" rx="4"/>
    <text class="badge ink" x="90" y="334" text-anchor="middle">result</text>

    <text class="sub muted" x="90" y="380" text-anchor="middle">stdio</text>
    <text class="sub muted" x="335" y="380" text-anchor="middle">Streamable HTTP + x402</text>
    <text class="sub muted" x="690" y="380" text-anchor="middle">Base Sepolia to sandbox</text>
  </g>
</svg>
